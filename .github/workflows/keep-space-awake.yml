name: Keep CogniLens Space Awake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ping-space:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping deployed health endpoint
        run: |
          set -euo pipefail
          URL="${COGNILENS_SPACE_URL:-https://conradfishe-cognilens.hf.space}/health"
          echo "Pinging ${URL}"
          curl --fail --show-error --silent --max-time 60 "$URL"
        env:
          COGNILENS_SPACE_URL: ${{ vars.COGNILENS_SPACE_URL }}
