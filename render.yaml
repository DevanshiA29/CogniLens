services:
  - type: web
    runtime: docker
    name: agentic-store-intelligence
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: STORE_INTEL_DB_PATH
        value: /app/data/store_intel.db
      - key: STORE_INTEL_UPLOAD_DIR
        value: /app/uploads
      - key: STORE_INTEL_USE_YOLO
        value: "0"
