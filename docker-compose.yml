services:
  store-intel:
    build: .
    image: agentic-store-intelligence:latest
    ports:
      - "8000:8000"
    volumes:
      - store_intel_data:/app/data
      - store_intel_uploads:/app/uploads
    environment:
      STORE_INTEL_DB_PATH: /app/data/store_intel.db
      STORE_INTEL_UPLOAD_DIR: /app/uploads
      STORE_INTEL_USE_YOLO: "0"
      STORE_INTEL_MAX_ANALYSIS_SECONDS: "0"
      STORE_INTEL_CHUNK_SECONDS: "300"
      STORE_INTEL_ANALYSIS_WIDTH: "960"
      STORE_INTEL_FRAME_SAMPLE_SECONDS: "1"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  store_intel_data:
  store_intel_uploads:
