[project]
name = "agentic-store-intelligence"
version = "0.1.0"
description = "Agentic CCTV-to-retail-analytics system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
vision = [
  "ultralytics>=8.3",
]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
